<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เครื่องตอบ - ใช่ หรือ มั่ว?</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Kanit", "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
        }
        .buzzer-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 12px;
            gap: 12px;
        }
        .buzzer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 8px 16px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            margin-right: 6px;
        }
        .buzzer-q-preview {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 12px 16px;
            color: #e2e8f0;
            font-size: 1.15rem;
            text-align: center;
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .buzzer-buttons {
            flex: 1;
            display: flex;
            gap: 14px;
            width: 100%;
            position: relative;
        }
        .btn-buzzer {
            flex: 1;
            border: none;
            border-radius: 28px;
            font-size: clamp(2.2rem, 9vw, 3.8rem);
            font-weight: 900;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), inset 0 4px 0 rgba(255, 255, 255, 0.4);
            transition: transform 0.08s ease, filter 0.08s ease;
            position: relative;
        }
        .btn-buzzer:active {
            transform: scale(0.95) translateY(4px);
        }
        .btn-yes {
            background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
            border-bottom: 8px solid #14532d;
        }
        .btn-no {
            background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
            border-bottom: 8px solid #7f1d1d;
        }
        .buzzer-emoji {
            font-size: clamp(3.2rem, 13vw, 5.5rem);
            line-height: 1;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
        }
        .buzzer-label {
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .buzzer-footer {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 4px;
        }
        .feedback-banner {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.94);
            border-radius: 28px;
            z-index: 10;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: #ffffff;
            padding: 20px;
            text-align: center;
            animation: fadeIn 0.15s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="buzzer-container">
        <div class="buzzer-header">
            <div><span id="conn-dot" class="status-dot"></span><span id="conn-text">เชื่อมต่อพร้อมตอบ 🟢</span></div>
            <div id="room-badge" style="font-family: monospace; background: rgba(0,0,0,0.3); padding: 3px 10px; border-radius: 8px;">ROOM: ----</div>
        </div>

        <div id="q-preview" class="buzzer-q-preview">
            กดปุ่ม ใช่ หรือ มั่ว ได้ทันที!
        </div>

        <div class="buzzer-buttons">
            <!-- Button ใช่ (Green) -->
            <button id="btn-answer-yes" class="btn-buzzer btn-yes">
                <span class="buzzer-emoji">⭕</span>
                <span class="buzzer-label">ใช่</span>
            </button>

            <!-- Button มั่ว (Red) -->
            <button id="btn-answer-no" class="btn-buzzer btn-no">
                <span class="buzzer-emoji">❌</span>
                <span class="buzzer-label">มั่ว</span>
            </button>

            <!-- Answer Feedback Lock Overlay -->
            <div id="feedback-lock" class="feedback-banner">
                <div id="feedback-emoji" style="font-size: 4.5rem;">🎯</div>
                <div id="feedback-text" style="font-size: 1.8rem; font-weight: 900;">ตอบแล้ว! ส่งสัญญาณแล้ว</div>
                <div style="font-size: 1rem; color: #cbd5e1; margin-top: 4px;">จอหลักกำลังหยุดเวลาและตรวจคำตอบ...</div>
                <button id="btn-unlock-answer" style="margin-top: 10px; padding: 8px 20px; border-radius: 99px; border: none; background: rgba(255,255,255,0.2); color: #fff; font-size: 0.95rem; font-weight: 700; cursor: pointer;">
                    กดเปลี่ยนคำตอบ
                </button>
            </div>
        </div>

        <div class="buzzer-footer">
            👆 กดปุ่มสีเขียว (ใช่) หรือ สีแดง (มั่ว) ได้เลย!
        </div>
    </div>

    <!-- Paho MQTT CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const rawRoom = urlParams.get('room') || 'DEFAULT';
            const roomId = rawRoom.toUpperCase().replace(/[^A-Z0-9]/g, '');

            const connDot = document.getElementById('conn-dot');
            const connText = document.getElementById('conn-text');
            const roomBadge = document.getElementById('room-badge');
            const qPreview = document.getElementById('q-preview');
            const btnYes = document.getElementById('btn-answer-yes');
            const btnNo = document.getElementById('btn-answer-no');
            const feedbackLock = document.getElementById('feedback-lock');
            const feedbackEmoji = document.getElementById('feedback-emoji');
            const feedbackText = document.getElementById('feedback-text');
            const btnUnlock = document.getElementById('btn-unlock-answer');

            roomBadge.textContent = 'ROOM: ' + roomId;

            // Audio SFX
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            function playBeep(freq = 600, dur = 0.1) {
                try {
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + dur);
                } catch(e) {}
            }

            // Universal ntfy.sh PubSub Topics
            const ntfyClientTopic = 'prg_quiz_' + roomId + '_client';
            const ntfyHostTopic = 'prg_quiz_' + roomId + '_host';

            // 1. Listen to Host via ntfy WebSocket
            let ntfyWs = null;
            function connectNtfyWs() {
                try {
                    ntfyWs = new WebSocket('wss://ntfy.sh/' + ntfyHostTopic + '/ws');
                    ntfyWs.onopen = () => {
                        connDot.style.background = '#22c55e';
                        connText.textContent = 'ออนไลน์พร้อมตอบ 🟢';
                    };
                    ntfyWs.onmessage = (event) => {
                        try {
                            const ntfyMsg = JSON.parse(event.data);
                            if (ntfyMsg.event === 'message') {
                                const payload = JSON.parse(ntfyMsg.message);
                                handleHostMessage(payload);
                            }
                        } catch(e) {}
                    };
                    ntfyWs.onclose = () => {
                        setTimeout(connectNtfyWs, 2000);
                    };
                } catch(e) {}
            }
            connectNtfyWs();

            // 2. MQTT Backup
            let mqttClient = null;
            function initMqtt() {
                if (typeof Paho === 'undefined') return;
                try {
                    const cid = 'bz_' + Math.random().toString(36).substring(2, 8);
                    mqttClient = new Paho.MQTT.Client('broker.emqx.io', 8084, cid);
                    mqttClient.onMessageArrived = (m) => {
                        try { handleHostMessage(JSON.parse(m.payloadString)); } catch(e) {}
                    };
                    mqttClient.connect({
                        useSSL: true,
                        timeout: 4,
                        onSuccess: () => {
                            mqttClient.subscribe('prg/quiz/' + roomId + '/host');
                        }
                    });
                } catch(e) {}
            }
            initMqtt();

            // 3. BroadcastChannel & LocalStorage (Same browser fallback)
            const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('prg_quiz_' + roomId) : null;
            if (bc) {
                bc.onmessage = (e) => handleHostMessage(e.data);
            }
            window.addEventListener('storage', (e) => {
                if (e.key === 'prg_quiz_host_state_' + roomId && e.newValue) {
                    try { handleHostMessage(JSON.parse(e.newValue)); } catch(err) {}
                }
            });

            // Master Send function: Send through HTTP POST + WS + MQTT + BC + Storage
            function sendToHost(payload) {
                const str = JSON.stringify({ ...payload, _t: Date.now() });

                // A. Instant HTTP POST to ntfy.sh (Guaranteed to cross any network/NAT instantly!)
                try {
                    fetch('https://ntfy.sh/' + ntfyClientTopic, {
                        method: 'POST',
                        body: str,
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' }
                    }).catch(() => {});
                } catch(e) {}

                // B. MQTT
                if (mqttClient && mqttClient.isConnected()) {
                    try {
                        const m = new Paho.MQTT.Message(str);
                        m.destinationName = 'prg/quiz/' + roomId + '/client';
                        mqttClient.send(m);
                    } catch(e) {}
                }

                // C. BroadcastChannel
                if (bc) {
                    try { bc.postMessage(payload); } catch(e) {}
                }

                // D. LocalStorage
                try {
                    localStorage.setItem('prg_quiz_action_' + roomId, str);
                } catch(e) {}
            }

            function handleHostMessage(data) {
                if (!data || !data.type) return;

                if (data.type === 'STATE_UPDATE') {
                    if (data.questionText) {
                        qPreview.textContent = data.questionText;
                    }
                    if (data.status === 'RUNNING') {
                        feedbackLock.style.display = 'none';
                    } else if (data.status === 'PAUSED_ANSWERED') {
                        feedbackLock.style.display = 'flex';
                        if (data.lastAnswer === 'YES') {
                            feedbackEmoji.textContent = '⭕';
                            feedbackText.textContent = 'คุณตอบ: ใช่';
                        } else if (data.lastAnswer === 'NO') {
                            feedbackEmoji.textContent = '❌';
                            feedbackText.textContent = 'คุณตอบ: มั่ว';
                        }
                    } else if (data.status === 'TIME_UP') {
                        feedbackLock.style.display = 'flex';
                        feedbackEmoji.textContent = '⏰';
                        feedbackText.textContent = 'หมดเวลา!';
                    } else if (data.status === 'IDLE') {
                        feedbackLock.style.display = 'none';
                    }
                }
            }

            function submitAnswer(ans) {
                playBeep(ans === 'YES' ? 880 : 380, 0.15);
                feedbackLock.style.display = 'flex';
                feedbackEmoji.textContent = ans === 'YES' ? '⭕' : '❌';
                feedbackText.textContent = 'คุณตอบ: ' + (ans === 'YES' ? 'ใช่' : 'มั่ว');

                sendToHost({
                    type: 'ANSWER_SUBMITTED',
                    answer: ans,
                    timestamp: Date.now()
                });
            }

            btnYes.addEventListener('click', () => submitAnswer('YES'));
            btnNo.addEventListener('click', () => submitAnswer('NO'));

            if (btnUnlock) {
                btnUnlock.addEventListener('click', () => {
                    feedbackLock.style.display = 'none';
                });
            }

            // Tell host we joined
            setTimeout(() => {
                sendToHost({ type: 'JOIN' });
            }, 300);
        })();
    </script>
</body>
</html>
