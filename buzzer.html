<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เครื่องตอบ - ใช่ หรือ มั่ว?</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Kanit", "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
        }
        .buzzer-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 12px;
            gap: 12px;
        }
        .buzzer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 8px 14px;
            color: #ffffff;
            font-size: 0.92rem;
            font-weight: 600;
            gap: 8px;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f59e0b;
            margin-right: 6px;
            box-shadow: 0 0 8px currentColor;
        }
        .buzzer-room-btn {
            font-family: monospace;
            background: rgba(255, 255, 255, 0.16);
            padding: 5px 12px;
            border-radius: 99px;
            color: #ffffff;
            font-weight: 800;
            border: 1px solid rgba(255, 255, 255, 0.25);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .buzzer-room-btn:active {
            transform: scale(0.96);
        }
        .buzzer-q-preview {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 12px 16px;
            color: #f8fafc;
            font-size: 1.1rem;
            text-align: center;
            min-height: 62px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-weight: 700;
            line-height: 1.35;
        }
        .buzzer-live-timer {
            font-size: 0.92rem;
            font-weight: 800;
            color: #38bdf8;
            font-family: monospace;
        }
        .buzzer-buttons {
            flex: 1;
            display: flex;
            gap: 14px;
            width: 100%;
            position: relative;
        }
        .btn-buzzer {
            flex: 1;
            border: none;
            border-radius: 28px;
            font-size: clamp(2.2rem, 9vw, 3.8rem);
            font-weight: 900;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), inset 0 4px 0 rgba(255, 255, 255, 0.4);
            transition: transform 0.08s ease, filter 0.08s ease, opacity 0.15s ease;
            position: relative;
        }
        .btn-buzzer:active:not(:disabled) {
            transform: scale(0.92) translateY(6px);
            filter: brightness(1.18);
        }
        .btn-buzzer:not(:disabled) {
            animation: buzzerReadyPulse 1.6s ease-in-out infinite alternate;
        }
        @keyframes buzzerReadyPulse {
            0% { transform: scale(1); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), inset 0 4px 0 rgba(255, 255, 255, 0.4); }
            100% { transform: scale(1.025); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55), 0 0 22px rgba(255, 255, 255, 0.25), inset 0 4px 0 rgba(255, 255, 255, 0.6); }
        }
        .btn-buzzer:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            filter: grayscale(0.8);
            pointer-events: none;
        }
        .btn-yes {
            background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
            border-bottom: 8px solid #14532d;
        }
        .btn-no {
            background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
            border-bottom: 8px solid #7f1d1d;
        }
        .buzzer-emoji {
            font-size: clamp(3.2rem, 13vw, 5.5rem);
            line-height: 1;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
        }
        .buzzer-label {
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .buzzer-footer {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 4px;
        }
        /* Lock / Block Overlay: Shown by default whenever Host timer is NOT running */
        .feedback-banner {
            display: flex;
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.96);
            border: 3px solid #475569;
            border-radius: 28px;
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #ffffff;
            padding: 20px;
            text-align: center;
            animation: feedbackPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        @keyframes feedbackPop {
            0% { opacity: 0; transform: scale(0.7) translateY(15px); }
            70% { transform: scale(1.04) translateY(-3px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .feedback-banner.waiting {
            border-color: #3b82f6;
        }
        .feedback-banner.yes {
            border: 4px solid #22c55e;
        }
        .feedback-banner.no {
            border: 4px solid #ef4444;
        }
        .feedback-banner.timeout {
            border: 4px solid #f59e0b;
        }
        .locked-tag {
            background: rgba(255, 255, 255, 0.14);
            padding: 6px 16px;
            border-radius: 99px;
            font-size: 0.92rem;
            font-weight: 700;
            color: #fbbf24;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="buzzer-container">
        <div class="buzzer-header">
            <div><span id="conn-dot" class="status-dot"></span><span id="conn-text">กำลังเชื่อมต่อจอหลัก...</span></div>
            <button type="button" id="room-badge" class="buzzer-room-btn" title="แตะเพื่อเปลี่ยนรหัสห้อง">
                ROOM: <strong id="room-code-text">1234</strong> ✏️
            </button>
        </div>

        <div id="q-preview" class="buzzer-q-preview">
            <div id="q-preview-text">กำลังซิงก์โจทย์จากเครื่องถาม...</div>
            <div id="q-preview-timer" class="buzzer-live-timer">⏱️ รอคนถามกดเริ่มจับเวลา</div>
        </div>

        <div class="buzzer-buttons">
            <!-- Button ใช่ (Green) - Disabled by default until Host starts timer -->
            <button id="btn-answer-yes" class="btn-buzzer btn-yes" disabled>
                <span class="buzzer-emoji">⭕</span>
                <span class="buzzer-label">ใช่</span>
            </button>

            <!-- Button มั่ว (Red) - Disabled by default until Host starts timer -->
            <button id="btn-answer-no" class="btn-buzzer btn-no" disabled>
                <span class="buzzer-emoji">❌</span>
                <span class="buzzer-label">มั่ว</span>
            </button>

            <!-- Lock Overlay: Blocks buttons whenever timer is NOT running or after answering once -->
            <div id="feedback-lock" class="feedback-banner waiting">
                <div id="feedback-emoji" style="font-size: 4.5rem;">⏳</div>
                <div id="feedback-text" style="font-size: 1.75rem; font-weight: 900;">รอเครื่องถามกด "เริ่มจับเวลา"</div>
                <div id="feedback-tag" class="locked-tag">🔒 บล็อกปุ่มชั่วคราว (เวลายังไม่เดิน)</div>
                <div id="feedback-sub" style="font-size: 1rem; color: #cbd5e1; margin-top: 4px; font-weight: 600;">
                    ทันทีที่คนถามกดเริ่ม ปุ่ม "ใช่ / มั่ว" จะเปิดให้กดทันที!
                </div>
            </div>
        </div>

        <div id="buzzer-footer" class="buzzer-footer">
            🔒 ปุ่มจะเปิดให้กดเฉพาะตอนที่เวลากำลังเดินเท่านั้น (ตอบได้ครั้งเดียว)
        </div>
    </div>

    <!-- Paho MQTT & PeerJS CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            let rawRoom = urlParams.get('room') || localStorage.getItem('prg_quiz_room_v3') || '1234';
            let roomId = rawRoom.toUpperCase().replace(/[^A-Z0-9]/g, '') || '1234';
            localStorage.setItem('prg_quiz_room_v3', roomId);

            const connDot = document.getElementById('conn-dot');
            const connText = document.getElementById('conn-text');
            const roomBadge = document.getElementById('room-badge');
            const roomCodeText = document.getElementById('room-code-text');
            const qPreviewText = document.getElementById('q-preview-text');
            const qPreviewTimer = document.getElementById('q-preview-timer');
            const btnYes = document.getElementById('btn-answer-yes');
            const btnNo = document.getElementById('btn-answer-no');
            const feedbackLock = document.getElementById('feedback-lock');
            const feedbackEmoji = document.getElementById('feedback-emoji');
            const feedbackText = document.getElementById('feedback-text');
            const feedbackTag = document.getElementById('feedback-tag');
            const feedbackSub = document.getElementById('feedback-sub');
            const buzzerFooter = document.getElementById('buzzer-footer');

            roomCodeText.textContent = roomId;

            roomBadge.addEventListener('click', () => {
                const newRoom = prompt('ใส่รหัสห้องให้ตรงกับเครื่องถาม (เช่น 1234):', roomId);
                if (newRoom && newRoom.trim()) {
                    const sanitized = newRoom.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
                    if (sanitized) {
                        localStorage.setItem('prg_quiz_room_v3', sanitized);
                        window.location.search = '?room=' + sanitized;
                    }
                }
            });

            // State
            let hostStatus = 'IDLE'; // Blocked unless 'RUNNING'
            let currentHostRoundId = null;
            let answeredRoundId = null;
            let myLastAnswer = null;
            let hostConnected = false;

            // Audio SFX
            let audioCtx = null;
            function playBeep(freq = 600, dur = 0.14) {
                try {
                    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + dur);
                } catch(e) {}
            }

            function markConnected() {
                hostConnected = true;
                connDot.style.background = '#22c55e';
                connText.textContent = 'เชื่อมต่อเครื่องถามแล้ว 🟢';
            }

            function lockButtons(mode, emoji, title, tagText, subText) {
                btnYes.disabled = true;
                btnNo.disabled = true;
                feedbackLock.style.display = 'flex';
                feedbackLock.className = 'feedback-banner ' + (mode || 'waiting');
                feedbackEmoji.textContent = emoji;
                feedbackText.textContent = title;
                feedbackTag.textContent = tagText;
                feedbackSub.textContent = subText;
            }

            function unlockButtons() {
                btnYes.disabled = false;
                btnNo.disabled = false;
                feedbackLock.style.display = 'none';
                buzzerFooter.textContent = '🔥 เวลาเดินอยู่! กด "ใช่ (⭕)" หรือ "มั่ว (❌)" ได้เลย! (กดได้ครั้งเดียว)';
            }

            // --- Multi-Channel Transports (EMQX + HiveMQ + PeerJS + BroadcastChannel + LocalStorage) ---
            let emqxClient = null;
            let hiveClient = null;
            let peer = null;
            let peerConn = null;
            let bcRoom = null;
            let bcGlobal = null;
            let lastSeenHostLs = '';

            // 1. EMQX MQTT (mqttVersion: 4)
            function initEmqx() {
                if (typeof Paho === 'undefined') return;
                try {
                    const cid = 'prg_bz_emqx_' + Math.random().toString(36).substring(2, 9);
                    emqxClient = new Paho.MQTT.Client('broker.emqx.io', 8084, '/mqtt', cid);
                    emqxClient.onMessageArrived = (m) => {
                        try { handleHostMessage(JSON.parse(m.payloadString)); } catch(e) {}
                    };
                    emqxClient.onConnectionLost = () => {
                        setTimeout(initEmqx, 2500);
                    };
                    emqxClient.connect({
                        useSSL: true,
                        mqttVersion: 4,
                        timeout: 5,
                        keepAliveInterval: 30,
                        onSuccess: () => {
                            connDot.style.background = '#22c55e';
                            if (!hostConnected) connText.textContent = 'ออนไลน์พร้อมซิงก์ 🟢';
                            try {
                                emqxClient.subscribe('prg/quiz/' + roomId + '/host');
                                emqxClient.subscribe('prg/quiz/GLOBAL/host');
                                emqxClient.subscribe('prg/quiz/1234/host');
                            } catch(e) {}
                            sendToHost({ type: 'JOIN', msgId: 'join_' + Date.now() + '_' + Math.random() });
                        },
                        onFailure: () => {
                            setTimeout(initEmqx, 3000);
                        }
                    });
                } catch(e) {}
            }

            // 2. HiveMQ MQTT (mqttVersion: 4)
            function initHiveMq() {
                if (typeof Paho === 'undefined') return;
                try {
                    const cid = 'prg_bz_hive_' + Math.random().toString(36).substring(2, 9);
                    hiveClient = new Paho.MQTT.Client('broker.hivemq.com', 8884, '/mqtt', cid);
                    hiveClient.onMessageArrived = (m) => {
                        try { handleHostMessage(JSON.parse(m.payloadString)); } catch(e) {}
                    };
                    hiveClient.onConnectionLost = () => {
                        setTimeout(initHiveMq, 3000);
                    };
                    hiveClient.connect({
                        useSSL: true,
                        mqttVersion: 4,
                        timeout: 5,
                        keepAliveInterval: 30,
                        onSuccess: () => {
                            connDot.style.background = '#22c55e';
                            if (!hostConnected) connText.textContent = 'ออนไลน์พร้อมซิงก์ 🟢';
                            try {
                                hiveClient.subscribe('prg/quiz/' + roomId + '/host');
                                hiveClient.subscribe('prg/quiz/GLOBAL/host');
                                hiveClient.subscribe('prg/quiz/1234/host');
                            } catch(e) {}
                            sendToHost({ type: 'JOIN', msgId: 'join_h_' + Date.now() + '_' + Math.random() });
                        },
                        onFailure: () => {
                            setTimeout(initHiveMq, 4000);
                        }
                    });
                } catch(e) {}
            }

            // 3. PeerJS WebRTC DataChannel
            function initPeerJs() {
                if (typeof Peer === 'undefined') return;
                try {
                    peer = new Peer();
                    peer.on('open', () => {
                        connectPeerToHost();
                    });
                } catch(e) {}
            }

            function connectPeerToHost() {
                if (!peer || !peer.open) return;
                try {
                    const targetPeerId = 'prg-quiz-host-v3-' + roomId.toLowerCase();
                    peerConn = peer.connect(targetPeerId, { reliable: true });
                    peerConn.on('open', () => {
                        markConnected();
                        peerConn.send({ type: 'JOIN', msgId: 'join_p_' + Date.now() });
                    });
                    peerConn.on('data', (data) => {
                        handleHostMessage(data);
                    });
                } catch(e) {}
            }

            // 4. BroadcastChannel & LocalStorage 60ms Memory Watcher
            try {
                if ('BroadcastChannel' in window) {
                    bcRoom = new BroadcastChannel('prg_quiz_bc_v3_' + roomId);
                    bcGlobal = new BroadcastChannel('prg_quiz_bc_v3_GLOBAL');
                    bcRoom.onmessage = (e) => handleHostMessage(e.data);
                    bcGlobal.onmessage = (e) => handleHostMessage(e.data);
                }
            } catch(e) {}

            window.addEventListener('storage', (e) => {
                if (e.key && e.key.startsWith('prg_quiz_ls_host_v3_') && e.newValue) {
                    try { handleHostMessage(JSON.parse(e.newValue)); } catch(err) {}
                }
            });

            setInterval(() => {
                try {
                    const raw = localStorage.getItem('prg_quiz_ls_host_v3_' + roomId) || localStorage.getItem('prg_quiz_ls_host_v3_GLOBAL');
                    if (raw && raw !== lastSeenHostLs) {
                        lastSeenHostLs = raw;
                        handleHostMessage(JSON.parse(raw));
                    }
                } catch(e) {}
            }, 60);

            function publishViaMqtt(client, str) {
                if (!client || !client.isConnected()) return;
                try {
                    const m1 = new Paho.MQTT.Message(str);
                    m1.destinationName = 'prg/quiz/' + roomId + '/client';
                    client.send(m1);

                    const m2 = new Paho.MQTT.Message(str);
                    m2.destinationName = 'prg/quiz/GLOBAL/client';
                    client.send(m2);
                } catch(e) {}
            }

            function sendToHost(payload) {
                const fullPayload = {
                    ...payload,
                    roomId: roomId,
                    _t: Date.now()
                };
                const str = JSON.stringify(fullPayload);

                // 1 & 2: EMQX + HiveMQ
                publishViaMqtt(emqxClient, str);
                publishViaMqtt(hiveClient, str);

                // 3: PeerJS
                try {
                    if (peerConn && peerConn.open) peerConn.send(fullPayload);
                } catch(e) {}

                // 4: BroadcastChannel
                try {
                    if (bcRoom) bcRoom.postMessage(fullPayload);
                    if (bcGlobal) bcGlobal.postMessage(fullPayload);
                } catch(e) {}

                // 5: LocalStorage
                try {
                    localStorage.setItem('prg_quiz_ls_client_v3_' + roomId, str);
                    localStorage.setItem('prg_quiz_ls_client_v3_GLOBAL', str);
                } catch(e) {}
            }

            function handleHostMessage(data) {
                if (!data || data.type !== 'STATE_UPDATE') return;

                markConnected();
                hostStatus = data.status;
                if (data.roundId) currentHostRoundId = data.roundId;

                if (data.questionText) {
                    qPreviewText.textContent = data.questionText;
                }

                const secStr = typeof data.remainingMs === 'number'
                    ? (Math.max(0, data.remainingMs) / 1000).toFixed(1)
                    : '--';

                if (data.status === 'RUNNING') {
                    qPreviewTimer.textContent = `🔥 เวลาเดินอยู่: ${secStr} วินาที — กดตอบได้เลย!`;
                    qPreviewTimer.style.color = '#4ade80';

                    // Only unlock if player has NOT already answered in this roundId
                    if (answeredRoundId && data.roundId && answeredRoundId === data.roundId) {
                        const isYes = myLastAnswer === 'YES';
                        lockButtons(
                            isYes ? 'yes' : 'no',
                            isYes ? '⭕' : '❌',
                            'คุณตอบ: ' + (isYes ? 'ใช่ ⭕' : 'มั่ว ❌'),
                            '🔒 ล็อกคำตอบแล้ว (ตอบได้ครั้งเดียว)',
                            'ส่งคำตอบไปยังเครื่องถามแล้ว!'
                        );
                    } else {
                        unlockButtons();
                    }
                } else if (data.status === 'PAUSED_ANSWERED') {
                    const ans = data.lastAnswer || myLastAnswer;
                    const isYes = ans === 'YES';
                    qPreviewTimer.textContent = `🛑 หยุดเวลาที่ ${secStr} วินาที`;
                    qPreviewTimer.style.color = '#fbbf24';
                    lockButtons(
                        isYes ? 'yes' : 'no',
                        isYes ? '⭕' : '❌',
                        'ตอบแล้ว: ' + (isYes ? 'ใช่ ⭕' : 'มั่ว ❌'),
                        '🔒 ล็อกคำตอบแล้ว (ตอบได้ครั้งเดียว)',
                        '🛑 เวลาบนจอคนถามหยุดแล้ว! รอคนถามกดเริ่มต่อ'
                    );
                } else if (data.status === 'PAUSED_MANUAL') {
                    qPreviewTimer.textContent = `⏸️ เวลาหยุดชั่วคราว (${secStr} วินาที)`;
                    qPreviewTimer.style.color = '#fbbf24';
                    lockButtons(
                        'waiting',
                        '⏸️',
                        'เครื่องถามหยุดเวลาชั่วคราว',
                        '🔒 บล็อกปุ่มชั่วคราว (เวลาหยุดอยู่)',
                        'รอเครื่องถามกด "จับเวลาต่อ" เพื่อเปิดปุ่มตอบ'
                    );
                } else if (data.status === 'TIME_UP') {
                    qPreviewTimer.textContent = `⏰ หมดเวลา! (0.0 วินาที)`;
                    qPreviewTimer.style.color = '#f87171';
                    lockButtons(
                        'timeout',
                        '⏰',
                        'หมดเวลา!',
                        '🔒 ปิดรับคำตอบ',
                        'รอเครื่องถามสุ่มข้อใหม่และกดเริ่มจับเวลา'
                    );
                } else {
                    // IDLE (Waiting for host to press Start)
                    answeredRoundId = null;
                    myLastAnswer = null;
                    qPreviewTimer.textContent = `⏱️ เวลาตั้งไว้ ${secStr} วินาที (รอคนถามกดเริ่ม)`;
                    qPreviewTimer.style.color = '#38bdf8';
                    lockButtons(
                        'waiting',
                        '⏳',
                        'รอเครื่องถามกด "เริ่มจับเวลา"',
                        '🔒 บล็อกปุ่มชั่วคราว (เวลายังไม่เดิน)',
                        'ทันทีที่คนถามกดเริ่ม ปุ่ม "ใช่ / มั่ว" จะเปิดให้กดทันที!'
                    );
                }
            }

            function submitAnswer(ans) {
                // Must be RUNNING and not yet answered in this round
                if (hostStatus !== 'RUNNING') return;
                if (answeredRoundId && currentHostRoundId && answeredRoundId === currentHostRoundId) return;

                answeredRoundId = currentHostRoundId || Date.now();
                myLastAnswer = ans;
                hostStatus = 'PAUSED_ANSWERED';

                // Immediately block buttons (Single-take only!)
                const isYes = ans === 'YES';
                lockButtons(
                    isYes ? 'yes' : 'no',
                    isYes ? '⭕' : '❌',
                    'คุณตอบ: ' + (isYes ? 'ใช่ ⭕' : 'มั่ว ❌'),
                    '🔒 ล็อกคำตอบแล้ว (ตอบได้ครั้งเดียว)',
                    '🛑 กำลังสั่งหยุดเวลาบนจอคนถาม...'
                );

                // SFX & Vibration
                playBeep(isYes ? 880 : 380, 0.18);
                if (navigator.vibrate) {
                    navigator.vibrate([80, 40, 80]);
                }

                // Unique msgId so Host processes it once even when sent across 5 channels + retries
                const msgId = 'ans_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);
                const payload = {
                    type: 'ANSWER_SUBMITTED',
                    answer: ans,
                    roundId: currentHostRoundId,
                    msgId: msgId
                };

                // Send immediately + fast burst retries to guarantee zero wireless packet loss
                sendToHost(payload);
                setTimeout(() => sendToHost(payload), 70);
                setTimeout(() => sendToHost(payload), 180);
            }

            btnYes.addEventListener('click', () => submitAnswer('YES'));
            btnNo.addEventListener('click', () => submitAnswer('NO'));

            // Start all transports
            initEmqx();
            initHiveMq();
            initPeerJs();

            // Send initial JOIN via local channels immediately
            sendToHost({ type: 'JOIN', msgId: 'join_init_' + Date.now() });
        })();
    </script>
</body>
</html>
