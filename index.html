<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture Reveal Game</title>
    <!-- Cropper.js CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Picture Reveal</h1>
            <div class="tabs">
                <button id="btn-home-mode" class="active">Home</button>
                <button id="btn-player-mode" style="display:none;">Play</button>
                <button id="btn-creator-mode">Creator</button>
            </div>
        </header>

        <main>
            <!-- Home Mode -->
            <section id="home-mode" class="mode-section active">
                <div class="home-panel glass-panel">
                    <h2>Welcome to Picture Reveal</h2>
                    <div class="home-actions" style="margin: 2rem 0; text-align: center;">
                        <button id="btn-home-create" class="btn primary" style="font-size: 1.2rem; padding: 1rem 2rem;">Create New Map</button>
                    </div>
                    
                    <div id="map-list-container" style="display: none; margin-top: 2rem;">
                        <h3>Your Maps</h3>
                        <div id="map-list" class="map-grid">
                            <!-- Map cards will be generated here -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- Player Mode -->
            <section id="player-mode" class="mode-section">
                <div class="score-board">
                    <h2>Score: <span id="player-score">1000</span></h2>
                </div>
                <div class="game-container">
                    <div id="game-image-bg" class="game-image-bg"></div>
                    <div id="game-grid" class="grid"></div>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 1rem; flex-wrap: wrap;">
                    <button id="btn-fullscreen" class="btn" style="background: rgba(255,255,255,0.2);">Fullscreen</button>
                    <button id="btn-finish-game" class="btn" style="background: #10b981; color: white;">Finish Game</button>
                    <button id="btn-reset-game" class="btn primary">Restart</button>
                </div>
            </section>

            <!-- Creator Mode -->
            <section id="creator-mode" class="mode-section">
                <div class="creator-panel glass-panel">
                    <h2>Game Settings</h2>

                    <div class="form-group">
                        <label for="map-name">Map Name:</label>
                        <input type="text" id="map-name" placeholder="Enter map name (e.g. Map 1)" value="My Map">
                    </div>
                    
                    <div class="form-group">
                        <label for="grid-size">Grid Size:</label>
                        <select id="grid-size">
                            <option value="2">2 x 2</option>
                            <option value="3" selected>3 x 3</option>
                            <option value="4">4 x 4</option>
                            <option value="5">5 x 5</option>
                            <option value="6">6 x 6</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="starting-score">Starting Score:</label>
                        <input type="number" id="starting-score" value="1000">
                    </div>

                    <div class="form-group">
                        <label for="aspect-ratio">Image Aspect Ratio:</label>
                        <select id="aspect-ratio">
                            <option value="1:1" selected>1:1 (Square)</option>
                            <option value="16:9">16:9 (Widescreen)</option>
                            <option value="4:3">4:3 (Standard)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="image-upload">Upload Background Image:</label>
                        <input type="file" id="image-upload" accept="image/*">
                    </div>

                    <h3>Set Points Reduction Per Tile</h3>
                    <p class="hint">Click inside a tile to change how many points the player loses when opening it.</p>
                    <div class="game-container creator-preview">
                        <div id="creator-grid" class="grid"></div>
                    </div>

                    <button id="btn-save-settings" class="btn primary">Save Game Settings</button>
                </div>
            </section>
        </main>
    </div>

    <!-- Cropper Modal -->
    <div id="cropper-modal" class="modal">
        <div class="modal-content glass-panel">
            <h2>Crop Image</h2>
            <div class="cropper-container">
                <img id="cropper-image" src="" alt="To be cropped">
            </div>
            <div class="modal-actions">
                <button id="btn-cancel-crop" class="btn">Cancel</button>
                <button id="btn-apply-crop" class="btn primary">Apply Crop</button>
            </div>
        </div>
    </div>
    <!-- Winner Modal -->
    <div id="winner-modal" class="modal">
        <div class="modal-content glass-panel" style="max-width: 400px; text-align: center;">
            <h2>We have a winner!</h2>
            <p style="margin: 1rem 0;">Final Score: <strong id="final-score-display" style="color: var(--primary); font-size: 1.5rem;"></strong></p>
            <div class="form-group">
                <input type="text" id="winner-name" placeholder="Enter winner's name" style="text-align: center;">
            </div>
            <div class="modal-actions" style="justify-content: center;">
                <button id="btn-cancel-winner" class="btn">Cancel</button>
                <button id="btn-save-winner" class="btn primary">Save Score</button>
            </div>
        </div>
    </div>

    <!-- Cropper.js JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
